name: Convert and Rename Resume

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  convert-and-rename:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository content
        uses: actions/checkout@v2

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install dependencies
        run: |
          npm init -y
          npm install marked puppeteer

      - name: Create conversion script
        run: |
          cat > convert.js << 'EOL'
          const fs = require("fs");
          const marked = require("marked");
          const puppeteer = require("puppeteer");
          
          const css = `
            <style>
              @page {
                size: A4;
                margin: 10mm 18mm 14mm 18mm;
              }
              body {
                font-family: Arial, Helvetica, sans-serif;
                line-height: 1.35;
                max-width: 100%;
                margin: 0;
                padding: 0;
                font-size: 10pt;
                color: #222;
              }
              h1 {
                color: #2c3e50;
                margin: 0 0 2px 0;
                padding: 0;
                font-size: 22pt;
                text-align: center;
                line-height: 1.15;
              }
              .contact-info {
                text-align: center;
                margin: 2px 0 8px 0;
                font-size: 9.5pt;
                line-height: 1.35;
              }
              h2 {
                color: #2c3e50;
                margin: 0.7em 0 0.25em 0;
                padding-bottom: 2px;
                font-size: 12pt;
                border-bottom: 1px solid #2c3e50;
                page-break-after: avoid;
              }
              h3 {
                color: #2c3e50;
                margin-top: 0.6em;
                margin-bottom: 0.25em;
                font-size: 11pt;
                page-break-after: avoid;
              }
              hr {
                border: none;
                border-top: 1px solid #d0d7de;
                margin: 0.55em 0;
              }
              a {
                color: #1a6fb5;
                text-decoration: none;
              }
              strong {
                font-weight: 700;
              }
              em {
                font-style: italic;
              }
              p {
                margin: 0.15em 0;
              }
              .edu-line {
                margin: 0.05em 0;
              }
              .job-org {
                margin: 0.55em 0 0 0;
                page-break-after: avoid;
              }
              .job-title {
                margin: 0 0 0.15em 0;
                page-break-after: avoid;
              }
              .job-title + ul {
                margin-top: 0.15em;
                page-break-inside: avoid;
              }
              .skill-line {
                display: block;
                margin: 0.28em 0;
              }
              p + ul {
                margin-top: 0.15em;
              }
              ul, ol {
                padding-left: 1.2em;
                margin: 0.2em 0 0.55em 0;
              }
              li {
                margin: 0.12em 0;
              }
              code {
                background: #f8f9fa;
                padding: 0.1em 0.2em;
                border-radius: 3px;
                font-family: monospace;
                font-size: 8.75pt;
              }
              pre {
                background: #f8f9fa;
                padding: 0.5em;
                border-radius: 5px;
                overflow-x: auto;
                font-size: 8.75pt;
              }
              blockquote {
                border-left: 4px solid #1a6fb5;
                margin: 0.5em 0;
                padding-left: 0.5em;
                color: #666;
              }
              table {
                border-collapse: collapse;
                width: 100%;
                margin: 0.5em 0;
              }
              th, td {
                border: 1px solid #ddd;
                padding: 4px;
                text-align: left;
              }
              th {
                background-color: #f8f9fa;
              }
            </style>
          `;
          
          async function convert() {
            const md = fs.readFileSync("Resume.md", "utf8");
            
            // Extract name from the first line: "# NAME: Your Name" (preferred) or "# Your Name"
            const nameDirective = md.match(/^# NAME:\s*(.+)$/m);
            const nameHeading = md.match(/^#\s+(.+)$/m);
            const name = (nameDirective?.[1] || nameHeading?.[1] || "").trim();
            if (!name) {
              throw new Error("Could not find name in Resume.md. First line should be '# NAME: Your Name'");
            }
            const pdfFilename = `${name.replace(/\s+/g, "_")}_Resume.pdf`;
            
            // Normalize NAME directive to a display heading and wrap contact info in a div
            const displayMd = md.replace(/^# NAME:\s*.*$/m, `# ${name}`)
                              .replace(/<p align="center">(.*?)<\/p>/s, '<div class="contact-info">$1</div>');

            // Keep HTML blocks (job wrappers, skill lines) intact through Markdown parsing
            marked.setOptions({ gfm: true, breaks: false });
            const html = marked.parse(displayMd);
            
            const fullHtml = `<!DOCTYPE html>
              <html>
                <head>
                  <meta charset="utf-8">
                  ${css}
                </head>
                <body>
                  ${html}
                </body>
              </html>`;
            
            fs.writeFileSync("temp.html", fullHtml);
            
            const browser = await puppeteer.launch({
              headless: "new",
              args: ["--no-sandbox", "--disable-setuid-sandbox"]
            });
            const page = await browser.newPage();
            
            await page.setJavaScriptEnabled(true);
            
            await page.setViewport({
              width: 1200,
              height: 800,
              deviceScaleFactor: 2
            });
            
            await page.goto(`file://${process.cwd()}/temp.html`, {
              waitUntil: "networkidle0"
            });
            
            await page.evaluate(() => {
              return new Promise((resolve) => {
                setTimeout(resolve, 1000);
              });
            });
            
            await page.pdf({
              path: pdfFilename,
              format: "A4",
              margin: {
                top: "10mm",
                right: "18mm",
                bottom: "14mm",
                left: "18mm"
              },
              printBackground: true,
              preferCSSPageSize: true,
              displayHeaderFooter: false
            });
            
            await browser.close();
            fs.unlinkSync("temp.html");
          }
          
          convert();
          EOL

      - name: Convert MD to PDF
        run: node convert.js

      - name: Commit changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f *_Resume.pdf
          git commit -m "Update resume PDF"
          git push origin main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
